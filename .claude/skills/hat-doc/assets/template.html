<meta charset="utf-8">
<title>ЗАГОЛОВОК — Flipper Zero</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{
    --bg:#e9e5db; --panel:#f4f0e8; --board:#efeae0;
    --ink:#221f19; --muted:#6f685c; --hairline:#d3ccbd; --grid-dot:#d7d0c1;
    --power:#2c6e77; --ir:#cc3d1a; --ir-soft:rgba(204,61,26,.13);
    --shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -28px rgba(40,30,10,.4);
    --font-mono:ui-monospace,"Cascadia Code","JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#141310; --panel:#1e1b16; --board:#1a1712;
      --ink:#ece6da; --muted:#9b9284; --hairline:#332f27; --grid-dot:#2a251e;
      --power:#74b9c2; --ir:#ff6a43; --ir-soft:rgba(255,106,67,.15);
      --shadow:0 1px 0 rgba(0,0,0,.3),0 20px 46px -30px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141310; --panel:#1e1b16; --board:#1a1712;
    --ink:#ece6da; --muted:#9b9284; --hairline:#332f27; --grid-dot:#2a251e;
    --power:#74b9c2; --ir:#ff6a43; --ir-soft:rgba(255,106,67,.15);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 20px 46px -30px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-sans); line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1060px; margin:0 auto; padding:clamp(28px,5vw,64px) clamp(18px,4vw,40px) 80px;}

  /* ---- header ---- */
  .eyebrow{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em;
    text-transform:uppercase; color:var(--ir); margin:0 0 14px;
  }
  h1{
    font-family:var(--font-sans); font-weight:700; text-wrap:balance;
    font-size:clamp(2.1rem,6vw,3.4rem); line-height:1.04; letter-spacing:-.02em;
    margin:0 0 18px;
  }
  .lede{font-size:clamp(1.02rem,2.3vw,1.2rem); color:var(--muted); max-width:60ch; margin:0 0 22px;}
  .chain{
    font-family:var(--font-mono); font-size:.86rem; color:var(--ink);
    background:var(--panel); border:1px solid var(--hairline); border-radius:10px;
    padding:12px 16px; display:inline-block; overflow-x:auto; max-width:100%;
    box-shadow:var(--shadow);
  }
  .chain b{color:var(--ir); font-weight:700}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 0; padding:0; list-style:none}
  .chips li{
    font-family:var(--font-mono); font-size:.72rem; letter-spacing:.04em;
    border:1px solid var(--hairline); border-radius:999px; padding:5px 12px;
    color:var(--muted); background:var(--panel);
  }
  .chips li b{color:var(--ink); font-weight:600}

  /* ---- figure ---- */
  figure{margin:clamp(30px,5vw,52px) 0; padding:0}
  .board{
    background:var(--board); border:1px solid var(--hairline); border-radius:16px;
    box-shadow:var(--shadow); padding:20px 20px 12px; overflow-x:auto;
  }
  .board svg{display:block; width:100%; min-width:940px; height:auto; color:var(--ink)}
  .legend{
    display:flex; flex-wrap:wrap; gap:18px 24px; align-items:center;
    font-family:var(--font-mono); font-size:.74rem; color:var(--muted);
    padding:2px 4px 14px;
  }
  .legend span{display:inline-flex; align-items:center; gap:8px}
  .legend i{width:22px; height:0; border-top-width:2.5px; border-top-style:solid; display:inline-block}
  .lg-ir i{border-color:var(--ir)}
  .lg-sig i{border-color:var(--ink)}
  .lg-pwr i{border-color:var(--power)}
  .lg-ir i.dash{border-top-style:dashed}
  figcaption{font-size:.88rem; color:var(--muted); margin-top:14px; max-width:70ch}
  figcaption b{color:var(--ink); font-weight:600}

  /* ---- section heading ---- */
  h2{
    font-size:1.35rem; letter-spacing:-.01em; margin:52px 0 4px;
  }
  .sub{color:var(--muted); margin:0 0 20px; font-size:.95rem}

  /* ---- BOM table ---- */
  .tablewrap{overflow-x:auto; border:1px solid var(--hairline); border-radius:12px; box-shadow:var(--shadow)}
  table{border-collapse:collapse; width:100%; min-width:560px; font-size:.9rem; background:var(--panel)}
  th,td{text-align:left; padding:11px 16px; border-bottom:1px solid var(--hairline); vertical-align:top}
  thead th{
    font-family:var(--font-mono); font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); font-weight:600; background:var(--board);
  }
  tbody tr:last-child td{border-bottom:0}
  td.ref{font-family:var(--font-mono); font-weight:700; color:var(--ir); white-space:nowrap}
  td.val{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink)}
  td.role{color:var(--muted)}

  /* ---- notes ---- */
  .notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-top:22px}
  .note{
    background:var(--panel); border:1px solid var(--hairline); border-radius:12px;
    padding:18px 18px 20px; box-shadow:var(--shadow); position:relative;
  }
  .note h3{margin:0 0 8px; font-size:1rem; display:flex; align-items:center; gap:9px}
  .note h3 .dot{width:9px; height:9px; border-radius:50%; background:var(--ir); flex:none}
  .note p{margin:0; font-size:.9rem; color:var(--muted)}
  .note p b{color:var(--ink); font-weight:600}

  /* ---- ordered build steps ---- */
  ol.steps{counter-reset:s; list-style:none; margin:22px 0 0; padding:0; display:grid; gap:12px}
  ol.steps li{
    counter-increment:s; position:relative; background:var(--panel);
    border:1px solid var(--hairline); border-radius:12px; padding:16px 18px 16px 58px;
    box-shadow:var(--shadow); font-size:.9rem; color:var(--muted);
  }
  ol.steps li::before{
    content:counter(s); position:absolute; left:20px; top:15px;
    font-family:var(--font-mono); font-weight:700; font-size:1rem; color:var(--ir);
  }
  ol.steps li b{color:var(--ink); font-weight:600; display:block; margin-bottom:4px}
  .aside{
    margin-top:16px; font-size:.88rem; color:var(--muted);
    border-left:2px solid var(--hairline); padding:2px 0 2px 16px; max-width:70ch;
  }
  .aside b{color:var(--ink); font-weight:600}

  footer{margin-top:56px; padding-top:22px; border-top:1px solid var(--hairline); color:var(--muted); font-size:.82rem; font-family:var(--font-mono)}
  footer a{color:var(--ir); text-decoration:none}

  /* ---- motion (subtle, opt-in) ---- */
  .ir-beam{stroke-dasharray:7 5}
  .glow{opacity:.6}
  @media (prefers-reduced-motion:no-preference){
    .ir-beam{animation:march 1.4s linear infinite}
    .glow{animation:pulse 3.4s ease-in-out infinite}
    @keyframes march{to{stroke-dashoffset:-24}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.75}}
  }
</style>

<div class="wrap">

  <p class="eyebrow">Flipper Zero · НАДЗАГОЛОВОК</p>
  <h1>ЗАГОЛОВОК</h1>
  <p class="lede">
    Одно-два предложения: что это за узел и зачем. Нейтральным инженерным тоном.
  </p>

  <!-- Пример фигуры со схемой. defs с сеткой точек объявляется один раз, id
       переиспользуется остальными фигурами в этом файле. -->
  <figure>
    <div class="legend" aria-hidden="true">
      <span class="lg-pwr"><i></i> питание / GND</span>
      <span class="lg-sig"><i></i> сигналы</span>
    </div>
    <div class="board">
      <svg viewBox="0 0 1240 480" role="img"
           aria-label="Подробное словесное описание всей цепи — служит и спецификацией, и доступным описанием.">
        <defs>
          <pattern id="dots3" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1.4" cy="1.4" r="1.1" fill="var(--grid-dot)"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="1240" height="480" fill="url(#dots3)" opacity="0.9"/>

        <!-- элементы схемы: currentColor — следует теме; var(--power) — питание;
             var(--ir) — акценты. Символы собираются из line/path/circle вручную. -->
      </svg>
    </div>
    <figcaption>
      Подпись под фигурой. Числа держать в синхроне с BOM и aria-label.
    </figcaption>
  </figure>

  <footer>
    esp32-flipper-exp · <a href="https://github.com/hleserg/esp32-flipper-exp">hleserg/esp32-flipper-exp</a>
  </footer>

</div>
