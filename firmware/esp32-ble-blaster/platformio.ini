; ESP32-WROOM (ESP32-D0WD) BLE blaster, triggered over UART from a Flipper Zero.
;
; build_dir/libdeps_dir are forced onto a SHORT path: NimBLE has very deeply
; nested source files and the default scratchpad path blows past Windows' 260-char
; MAX_PATH limit, which makes the NimBLE unpack fail ([WinError 206]).
; core_dir moves packages/platforms/framework OFF the Cyrillic home dir
; (C:\Users\й\.platformio). The xtensa MinGW gcc mangles the non-ASCII "й"
; in include paths to "?", so every framework header (Arduino.h, sdkconfig.h)
; reports "No such file" despite existing. An all-ASCII core_dir fixes it.
[platformio]
core_dir = C:/pio
build_dir = C:/bb/build
libdeps_dir = C:/bb/libdeps

[env:esp32dev]
; Pin a platform whose builder matches the installed Arduino-ESP32 2.0.x SDK
; layout (fixes "sdkconfig.h: No such file" from a mismatched newer platform).
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino @ ^1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0
